<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YONZ PAYMENT | Premium</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; }

html, body {
    background: #0a0a0f;
    min-height: 100vh;
    color: #fff;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.bg-glow {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
}
.bg-glow::before, .bg-glow::after {
    content: '';
    position: absolute;
    width: 60vmax;
    height: 60vmax;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.5;
    animation: floatGlow 12s infinite alternate ease-in-out;
}
.bg-glow::before {
    background: radial-gradient(circle, #2563eb, #7c3aed);
    top: -20vmax; left: -10vmax;
}
.bg-glow::after {
    background: radial-gradient(circle, #06b6d4, #3b82f6);
    bottom: -20vmax; right: -10vmax;
    animation-delay: -6s;
}
@keyframes floatGlow {
    0% { transform: translate(0,0) scale(1); }
    100% { transform: translate(5vmax,5vmax) scale(1.2); }
}

/* LOADER */
#loader {
    position: fixed;
    inset: 0;
    background: #0a0a0f;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 0.5s ease, visibility 0.5s ease;
}
#loader.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.loader-ring {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}
.loader-ring::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: #3b82f6;
    border-right-color: #8b5cf6;
    animation: spin 1.2s linear infinite;
}
.loader-ring::after {
    content: '';
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 3px solid transparent;
    border-bottom-color: #06b6d4;
    border-left-color: #3b82f6;
    animation: spinReverse 1.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes spinReverse { to { transform: rotate(-360deg); } }

.loader-percent {
    font-size: 3rem;
    font-weight: 800;
    background: linear-gradient(135deg, #60a5fa, #a78bfa, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    z-index: 2;
    letter-spacing: -2px;
}

.loader-text {
    margin-top: 24px;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
}

.loader-bar {
    margin-top: 30px;
    width: 280px;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 99px;
    overflow: hidden;
}
.loader-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6, #06b6d4);
    border-radius: 99px;
    box-shadow: 0 0 20px rgba(59,130,246,0.8);
    transition: width 0.1s linear;
}

/* MAIN */
#main-content {
    position: relative;
    z-index: 10;
    opacity: 0;
    transform: scale(0.95) translateY(20px);
    transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16,1,0.3,1);
    width: 100%;
    max-width: 440px;
    padding: 20px;
}
#main-content.visible {
    opacity: 1;
    transform: scale(1) translateY(0);
}

.card {
    background: rgba(18,18,28,0.75);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 32px;
    padding: 32px 28px;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.06);
    position: relative;
    overflow: hidden;
}
.card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
}

.badge-premium {
    position: absolute;
    top: 20px; right: 20px;
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    color: #000;
    font-size: 0.6rem;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 99px;
    letter-spacing: 1px;
    text-transform: uppercase;
    box-shadow: 0 4px 20px rgba(251,191,36,0.4);
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
}
.logo-icon {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    border-radius: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.4rem;
    box-shadow: 0 8px 24px rgba(37,99,235,0.4);
}
.logo-text h1 {
    font-size: 1.3rem;
    font-weight: 800;
    background: linear-gradient(135deg, #fff, #a5b4fc);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.5px;
}
.logo-text p {
    font-size: 0.65rem;
    color: rgba(255,255,255,0.4);
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.amount-section {
    text-align: center;
    margin-bottom: 24px;
    padding: 20px;
    background: rgba(255,255,255,0.03);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.05);
}
.amount-label {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 3px;
    font-weight: 600;
    margin-bottom: 8px;
}
.amount-value {
    font-size: 2rem;
    font-weight: 800;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -1px;
}

.payment-method {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 16px;
    transition: all 0.3s ease;
}
.payment-method:hover {
    border-color: rgba(96,165,250,0.3);
    background: rgba(255,255,255,0.05);
}

.method-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
}
.method-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #118eea, #0c6bc4);
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.1rem;
    color: white;
    box-shadow: 0 6px 18px rgba(17,142,234,0.35);
    font-weight: 800;
    font-style: italic;
}
.method-info h3 { font-size: 0.95rem; font-weight: 700; }
.method-info p { font-size: 0.7rem; color: rgba(255,255,255,0.4); font-weight: 500; }

.number-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(0,0,0,0.4);
    border-radius: 14px;
    padding: 12px 16px;
    border: 1px solid rgba(255,255,255,0.06);
}
.number-text {
    flex: 1;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #e0e7ff;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.copy-btn {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    border: none;
    color: white;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 14px rgba(37,99,235,0.4);
    white-space: nowrap;
    font-family: inherit;
}
.copy-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(37,99,235,0.6);
}
.copy-btn.copied {
    background: linear-gradient(135deg, #10b981, #059669);
    box-shadow: 0 4px 14px rgba(16,185,129,0.4);
}

.qris-btn {
    width: 100%;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
    padding: 16px;
    border-radius: 16px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.3s ease;
    margin-top: 8px;
    position: relative;
    overflow: hidden;
    font-family: inherit;
}
.qris-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    opacity: 0;
    transition: opacity 0.3s ease;
}
.qris-btn:hover::before { opacity: 1; }
.qris-btn span, .qris-btn i { position: relative; z-index: 1; }
.qris-btn:hover {
    border-color: transparent;
    box-shadow: 0 10px 30px rgba(59,130,246,0.4);
    transform: translateY(-2px);
}

.footer-note {
    text-align: center;
    margin-top: 20px;
    font-size: 0.65rem;
    color: rgba(255,255,255,0.25);
    letter-spacing: 1px;
}

/* MODAL */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 10000;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    visibility: hidden;
    transition: all 0.4s ease;
    padding: 20px;
}
.modal-overlay.active { opacity: 1; visibility: visible; }

.modal-content {
    background: rgba(18,18,28,0.95);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 28px;
    padding: 28px;
    max-width: 380px;
    width: 100%;
    transform: scale(0.9) translateY(20px);
    transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
    box-shadow: 0 40px 100px rgba(0,0,0,0.8);
}
.modal-overlay.active .modal-content { transform: scale(1) translateY(0); }

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}
.modal-header h2 {
    font-size: 1.1rem;
    font-weight: 800;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.close-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 0.9rem;
    font-family: inherit;
}
.close-btn:hover {
    background: rgba(239,68,68,0.2);
    border-color: rgba(239,68,68,0.4);
    color: #ef4444;
    transform: rotate(90deg);
}

.qris-image-wrapper {
    background: white;
    border-radius: 20px;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 18px;
    min-height: 200px;
}
.qris-image-wrapper img {
    width: 100%;
    max-width: 260px;
    height: auto;
    border-radius: 8px;
    display: block;
}

.qris-info { text-align: center; }
.qris-info p {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.5);
    line-height: 1.6;
}
.qris-info .merchant {
    font-size: 0.9rem;
    font-weight: 700;
    color: #e0e7ff;
    margin-bottom: 4px;
}

/* TOAST */
.toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(16,185,129,0.95);
    color: white;
    padding: 14px 24px;
    border-radius: 16px;
    font-size: 0.85rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 20px 60px rgba(16,185,129,0.5);
    z-index: 10001;
    transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
    border: 1px solid rgba(255,255,255,0.2);
    white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 480px) {
    .card { padding: 24px 20px; }
    .amount-value { font-size: 1.7rem; }
    .number-text { font-size: 0.95rem; }
    .copy-btn { padding: 8px 12px; font-size: 0.7rem; }
    .loader-percent { font-size: 2.5rem; }
    .loader-ring { width: 150px; height: 150px; }
    .loader-bar { width: 220px; }
}
</style>
</head>
<body>

<div class="bg-glow"></div>

<!-- LOADER -->
<div id="loader">
    <div class="loader-ring">
        <div class="loader-percent" id="loaderPercent">0%</div>
    </div>
    <div class="loader-text">MEMUAT DATABASE</div>
    <div class="loader-bar">
        <div class="loader-bar-fill" id="loaderBarFill"></div>
    </div>
</div>

<!-- MAIN CONTENT -->
<div id="main-content">
    <div class="card">
        <div class="badge-premium">PREMIUM</div>

        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-bolt"></i></div>
            <div class="logo-text">
                <h1>YONZ PAYMENT</h1>
                <p>Secure & Instant</p>
            </div>
        </div>

        <div class="amount-section">
            <div class="amount-label">JANGAN LUPA</div>
            <div class="amount-value">KIRIM BUKTI</div>
        </div>

        <div class="payment-method">
            <div class="method-header">
                <div class="method-icon">D</div>
                <div class="method-info">
                    <h3>DANA</h3>
                    <p>Transfer ke nomor berikut</p>
                </div>
            </div>
            <div class="number-box">
                <div class="number-text" id="danaNumber">6281234567890</div>
                <button class="copy-btn" id="copyBtn" onclick="copyNumber()">
                    <i class="fas fa-copy"></i>
                    <span id="copyText">Salin</span>
                </button>
            </div>
        </div>

        <button class="qris-btn" onclick="openQris()">
            <i class="fas fa-qrcode"></i>
            <span>Bayar dengan QRIS</span>
        </button>

        <div class="footer-note">
            <i class="fas fa-shield-alt"></i> Transaksi aman & terenkripsi
        </div>
    </div>
</div>

<!-- MODAL QRIS -->
<div class="modal-overlay" id="qrisModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-qrcode"></i> Scan QRIS</h2>
            <button class="close-btn" onclick="closeQris()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="qris-image-wrapper">
            <img id="qrisImage" src="" alt="QRIS Code">
        </div>
        <div class="qris-info">
            <p class="merchant">YONZ PAYMENT</p>
            <p>Scan kode QR di atas menggunakan aplikasi<br>DANA, OVO, GoPay, ShopeePay, atau m-banking</p>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastMessage">Nomor berhasil disalin!</span>
</div>

<script>
// ============ KONFIG ============
var DANA_NUMBER = '6285375564949';
var QRIS_URL = 'https://files.catbox.moe/xs16q3.jpg';

// ============ LOADER 5 DETIK ============
// Pakai setTimeout rekursif, PASTI jalan di semua editor
var progress = 0;
var totalTime = 5000; // 5 detik
var intervalPerStep = 50; // update tiap 50ms
var totalSteps = totalTime / intervalPerStep; // 100 step
var stepIncrement = 100 / totalSteps; // 1% per step

function tickLoader() {
    progress += stepIncrement;

    if (progress >= 100) {
        progress = 100;
        document.getElementById('loaderPercent').textContent = '100%';
        document.getElementById('loaderBarFill').style.width = '100%';

        // Tampilkan konten
        setTimeout(function() {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('main-content').classList.add('visible');
        }, 300);
        return;
    }

    document.getElementById('loaderPercent').textContent = Math.floor(progress) + '%';
    document.getElementById('loaderBarFill').style.width = progress + '%';

    setTimeout(tickLoader, intervalPerStep);
}

// Mulai loader pas script jalan
tickLoader();

// Safety net: paksa selesai setelah 7 detik kalau ada masalah
setTimeout(function() {
    var loader = document.getElementById('loader');
    if (loader && !loader.classList.contains('hidden')) {
        document.getElementById('loaderPercent').textContent = '100%';
        document.getElementById('loaderBarFill').style.width = '100%';
        loader.classList.add('hidden');
        document.getElementById('main-content').classList.add('visible');
    }
}, 7000);

// ============ SET DATA ============
document.getElementById('danaNumber').textContent = DANA_NUMBER;
document.getElementById('qrisImage').src = QRIS_URL;

// ============ COPY ============
function copyNumber() {
    var number = document.getElementById('danaNumber').textContent;
    var copyBtn = document.getElementById('copyBtn');
    var copyText = document.getElementById('copyText');
    var toast = document.getElementById('toast');
    var toastMessage = document.getElementById('toastMessage');

    function showSuccess() {
        copyBtn.classList.add('copied');
        copyText.textContent = 'Tersalin!';
        copyBtn.querySelector('i').className = 'fas fa-check';
        toastMessage.textContent = 'Nomor DANA berhasil disalin!';
        toast.classList.add('show');

        setTimeout(function() {
            copyBtn.classList.remove('copied');
            copyText.textContent = 'Salin';
            copyBtn.querySelector('i').className = 'fas fa-copy';
        }, 2500);
        setTimeout(function() { toast.classList.remove('show'); }, 2500);
    }

    function showError() {
        toastMessage.textContent = 'Gagal menyalin, salin manual!';
        toast.style.background = 'rgba(239,68,68,0.95)';
        toast.classList.add('show');
        setTimeout(function() {
            toast.classList.remove('show');
            toast.style.background = 'rgba(16,185,129,0.95)';
        }, 2500);
    }

    function fallback() {
        try {
            var ta = document.createElement('textarea');
            ta.value = number;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            var ok = document.execCommand('copy');
            document.body.removeChild(ta);
            if (ok) showSuccess(); else showError();
        } catch (e) { showError(); }
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(number).then(showSuccess).catch(fallback);
    } else {
        fallback();
    }
}

// ============ QRIS MODAL ============
function openQris() {
    document.getElementById('qrisModal').classList.add('active');
}
function closeQris() {
    document.getElementById('qrisModal').classList.remove('active');
}

document.getElementById('qrisModal').onclick = function(e) {
    if (e.target === this) closeQris();
};

// Fallback kalau QRIS gagal load
document.getElementById('qrisImage').onerror = function() {
    this.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">' +
        '<rect width="300" height="300" fill="#fff"/>' +
        '<rect x="20" y="20" width="80" height="80" fill="#000"/>' +
        '<rect x="200" y="20" width="80" height="80" fill="#000"/>' +
        '<rect x="20" y="200" width="80" height="80" fill="#000"/>' +
        '<rect x="110" y="110" width="80" height="80" fill="#000"/>' +
        '<text x="150" y="285" font-family="Arial" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">QRIS CODE</text>' +
        '</svg>'
    );
};
</script>
</body>
</html>
